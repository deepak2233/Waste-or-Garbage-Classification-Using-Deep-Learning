name: CI

on:
  push:
    branches: [main, "claude/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONUNBUFFERED: "1"
  TF_CPP_MIN_LOG_LEVEL: "3"

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install ruff
      - run: ruff check src/ tests/ scripts/
      - run: ruff format --check src/ tests/ scripts/

  test:
    name: Tests (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[all]"

      - name: Fast tests
        run: pytest tests/ -q -m "not slow" --cov=wasteclf --cov-report=term-missing

      # The slow tests train a real model. One interpreter version is enough,
      # and every config they use sets weights=null so CI never downloads
      # ImageNet checkpoints.
      - name: End-to-end tests
        if: matrix.python-version == '3.11'
        run: pytest tests/ -q -m slow

  smoke:
    name: CLI smoke test
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -e ".[all]"

      - name: Generate synthetic data
        run: python scripts/make_synthetic_data.py --out data/synthetic --per-class 20 --size 64

      - name: scan
        run: wasteclf scan --data-root data/synthetic

      - name: train
        run: wasteclf train -c configs/smoke.yaml

      - name: predict
        run: wasteclf predict --run runs/smoke data/synthetic/glass --json

      - name: export
        run: wasteclf export --run runs/smoke --format tflite

      - name: Upload run artefacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-run
          path: runs/smoke/
          retention-days: 7
