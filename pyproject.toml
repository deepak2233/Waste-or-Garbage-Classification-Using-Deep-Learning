[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "wasteclf"
version = "2.0.0"
description = "Waste and garbage image classification with transfer learning on TensorFlow/Keras"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Deepak Yadav" }]
keywords = ["computer-vision", "image-classification", "transfer-learning", "tensorflow", "waste-management"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
  "tensorflow>=2.15,<2.21; platform_machine != 'arm64'",
  "tensorflow-macos>=2.15; platform_machine == 'arm64' and sys_platform == 'darwin'",
  "numpy>=1.24",
  "pandas>=2.0",
  "scikit-learn>=1.3",
  "matplotlib>=3.7",
  "seaborn>=0.13",
  "PyYAML>=6.0",
  "Pillow>=10.0",
]

[project.optional-dependencies]
serve = ["fastapi>=0.110", "uvicorn[standard]>=0.29", "python-multipart>=0.0.9"]
# onnx is pinned below 1.18 on purpose: 1.18+ needs protobuf >= 6, TensorFlow
# 2.17 pins protobuf < 5, and pip will happily install the pair and leave you
# with a TensorFlow that cannot import.
onnx = ["onnx>=1.16,<1.18", "tf2onnx>=1.16", "onnxruntime>=1.17,<2"]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.5", "pre-commit>=3.7"]
all = ["wasteclf[serve,onnx,dev]"]

[project.scripts]
wasteclf = "wasteclf.cli:main"

[project.urls]
Homepage = "https://github.com/deepak2233/Waste-or-Garbage-Classification-Using-Deep-Learning"
Issues = "https://github.com/deepak2233/Waste-or-Garbage-Classification-Using-Deep-Learning/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
wasteclf = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
  "slow: tests that train a model end to end",
  "needs_tf: tests that import TensorFlow",
]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py39"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "RET", "ARG", "PTH"]
ignore = ["E501", "B008"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ARG001", "ARG002"]

[tool.ruff.format]
quote-style = "double"
